###############################################################################
# SciPulse — Infrastructure Docker
# Étape actuelle : Elasticsearch et Kibana
###############################################################################

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: scipulse-elasticsearch

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      cluster.name: scipulse-cluster
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"

    ports:
      - "${ELASTICSEARCH_PORT}:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped

    networks:
      - scipulse-network

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: scipulse-kibana

    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"

    ports:
      - "${KIBANA_PORT}:5601"

    depends_on:
      elasticsearch:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - scipulse-network

volumes:
  elasticsearch-data:
    name: scipulse-elasticsearch-data

networks:
  scipulse-network:
    name: scipulse-network
    driver: bridge  